<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>דרכון לעולם ✈️ | קורס סביב העולם</title>
<link rel="stylesheet" href="./246-main.css">
<script>
window.instinctFile = Object.freeze({
  initialRoute: decodeURIComponent(location.hash.slice(1) || '/'),
  route: function (path) {
    if (typeof path === 'string' && path.charAt(0) === '/' && path.charAt(1) !== '/' && path.length <= 2048) {
      location.hash = path;
      window.dispatchEvent(new CustomEvent('instinct-route', { detail: path }));
    }
  }
});
</script>
</head>
<body>
<div id="root"></div>
<script src="./247-main.js"></script>
</body>
</html>
